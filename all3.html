<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Kiểm Tra - Chủ Nghĩa Xã Hội Khoa Học</title>
    <style>
        :root {
            --primary: #8b0000;
            --primary-light: #fff5f5;
            --secondary: #d9534f;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-weight: bold;
        }

        .section-title {
            background: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            margin: 30px 0 15px 0;
            font-size: 1.2rem;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #111;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: #f1f3f5;
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .option-btn:hover:not([disabled]) {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .option-btn.selected {
            background: #e2e3e5;
            font-weight: bold;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            background-color: var(--primary-light);
            border-left: 4px solid var(--secondary);
            border-radius: 4px;
            font-size: 0.9rem;
            color: #444;
        }

        .explanation strong {
            color: var(--primary);
        }

        .actions {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .btn-reset {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-reset:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TÀI LIỆU ÔN TẬP CHỦ NGHĨA XÃ HỘI KHOA HỌC</h1>
        <p>Hệ thống câu hỏi ôn tập tương tác & Chấm điểm tự động</p>
    </header>

    <div class="stats-bar">
        <span>Tổng số câu: <span id="total-count">0</span></span>
        <span>Đã làm: <span id="answered-count">0</span></span>
        <span style="color: var(--success);">Đúng: <span id="correct-count">0</span></span>
    </div>

    <form id="quiz-form">
        <!-- Các câu hỏi sẽ được render tại đây -->
        <div id="questions-container"></div>
    </form>

    <div class="actions">
        <button type="button" class="btn-reset" onclick="resetQuiz()">Làm Lại Từ Đầu</button>
    </div>
</div>

let answeredSet = new Set();
let correctSet = new Set();

function renderQuiz() {
    const container = document.getElementById('questions-container');
    document.getElementById('total-count').innerText = quizData.length;
    
    let currentSection = "";
    
    quizData.forEach((data, index) => {
        if (data.section !== currentSection) {
            currentSection = data.section;
            const secTitle = document.createElement('div');
            secTitle.className = 'section-title';
            secTitle.innerText = currentSection;
            container.appendChild(secTitle);
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = data.q;
        card.appendChild(qText);

        const optionsGrid = document.createElement('div');
        optionsGrid.className = 'options-grid';

        data.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, optIdx);
            optionsGrid.appendChild(btn);
        });

        card.appendChild(optionsGrid);

        const exp = document.createElement('div');
        exp.className = 'explanation';
        exp.id = `exp-${index}`;
        exp.innerHTML = `<strong>Giải thích:</strong> ${data.explanation}`;
        card.appendChild(exp);

        container.appendChild(card);
    });
}

function selectOption(qIdx, optIdx) {
    const card = document.getElementById(`q-card-${qIdx}`);
    const btns = card.querySelectorAll('.option-btn');
    const exp = document.getElementById(`exp-${qIdx}`);
    const correctIdx = quizData[qIdx].correct;

    // Vô hiệu hóa các nút sau khi chọn
    btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIdx) {
            btn.classList.add('correct');
        }
    });

    if (optIdx !== correctIdx) {
        btns[optIdx].classList.add('incorrect');
    } else {
        correctSet.add(qIdx);
    }

    answeredSet.add(qIdx);
    exp.style.display = 'block';

    updateStats();
}

function updateStats() {
    document.getElementById('answered-count').innerText = answeredSet.size;
    document.getElementById('correct-count').innerText = correctSet.size;
}

function resetQuiz() {
    answeredSet.clear();
    correctSet.clear();
    updateStats();
    
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Khởi chạy khi tải trang
window.onload = renderQuiz;
</script>
